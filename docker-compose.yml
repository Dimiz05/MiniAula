services:
  api:
    build: ./api
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-miniaula}"
      MYSQL_USER: "${MYSQL_USER:-miniaula}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-miniaula-dev-only-password}"
      JWT_SECRET: "${JWT_SECRET:-miniaula-dev-only-jwt-secret-change-me-0123456789}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-2h}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:3000/api}"
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-miniaula}"
      MYSQL_USER: "${MYSQL_USER:-miniaula}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-miniaula-dev-only-password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-miniaula-dev-only-root-password}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
  uploads_data:
